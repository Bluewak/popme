category = ["스포츠", "축구"]
criteria = "- 한국 선수(손흥민·이강인·김민재·황희찬 등)의 출전·골·부상과 대표팀 소집 명단 발표를 가장 먼저 챙긴다.\n- 응원 팀의 경기 결과·순위 변동·감독 교체·구단이 발표한 이적(오피셜)은 빠뜨리지 않는다.\n- 이적설은 공신력 있는 기자(로마노·온스테인 등)나 현지 유력지 보도만 「~라는 보도」로 적고, 같은 소문의 재탕은 한 번만 쓴다.\n- 협회·연맹 행정(감독 선임, 회장 선거, 징계·오심 인정)은 결정된 내용 위주로 짧게 정리한다.\n- 선수 사생활·SNS 논란, 「충격」「대박」식 해외 반응 짜깁기, 중계 링크·베팅 글은 버린다.\n- 같은 경기를 다룬 기사가 여러 매체에서 오면 하나로 묶고, 경기 전 예상보다 결과와 기록을 앞세운다.\n"
discovery = "이적·감독 선임을 발표 전에 정확히 맞혀 온 기자나 전술·데이터로 경기를 풀어 주는 해설가를 고르고, 반응 기사 위주 계정은 뺀다."
