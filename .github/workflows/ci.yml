# 푸시·PR마다: 개인 파일·문구 검사 → 테스트(지원하는 Python 전부) → 코드 검사 → 실제 설치
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest   # 위젯이 Windows 전용이라 같은 환경에서
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]   # install.ps1이 받아 주는 버전 전부
    steps:
      - uses: actions/checkout@v7

      - name: 개인 파일·문구 검사
        env:
          PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}   # 개인 단어 목록 (Settings > Secrets). 코드엔 안 적음
        run: python tools/check_private.py --all

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 패키지 설치 (사용자에게 깔리는 잠금 파일 그대로)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest ruff

      - name: 테스트
        run: python -m pytest -q tests

      - name: 코드 검사 (안 쓴 import·없는 이름)
        run: python -m ruff check .

      - name: 문법 검사 (모든 .py 컴파일)
        run: python -m compileall -q popme tools tests

  install:
    uses: ./.github/workflows/install-test.yml
