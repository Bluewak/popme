# main의 커밋에 v로 시작하는 태그를 올리면 (예: git tag v1.7.0 && git push origin v1.7.0)
# 검사·테스트·취약점 검사·실제 설치 시험을 통과했을 때만 저장소 내용 그대로 zip을 만들어 GitHub Releases에 올린다.
# 받는 사람은 zip을 풀고 install.bat만 실행하면 된다. 먼저 popme/__init__.py의 __version__을 태그와 맞춘다.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: main에 머지된 커밋인지
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: 개인 파일·문구 검사
        env:
          PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}
        run: python tools/check_private.py --all

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 태그와 앱 버전이 같은지
        run: python -c "import os; from popme import __version__ as v; tag = os.environ['GITHUB_REF_NAME']; assert tag == 'v' + v, f'{tag} != v{v}'"

      - name: 테스트
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest pip-audit
          python -m pytest -q tests

      - name: 취약점 검사
        run: python -m pip_audit -r requirements.lock --require-hashes --disable-pip

  install:
    needs: check
    uses: ./.github/workflows/install-test.yml

  publish:
    needs: [check, install]
    runs-on: windows-latest
    permissions:
      contents: write   # 릴리스 만들기 (앞의 검사 단계에는 주지 않는다)
    steps:
      - uses: actions/checkout@v7

      - name: zip·체크섬 만들기 (개발용 파일은 .gitattributes export-ignore로 빠진다)
        shell: bash
        run: |
          git archive --format=zip --prefix=POPME/ -o "POPME-${GITHUB_REF_NAME}.zip" HEAD
          sha256sum "POPME-${GITHUB_REF_NAME}.zip" > "POPME-${GITHUB_REF_NAME}.zip.sha256"

      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" "POPME-${GITHUB_REF_NAME}.zip" "POPME-${GITHUB_REF_NAME}.zip.sha256" --title "POPME $GITHUB_REF_NAME" --generate-notes
