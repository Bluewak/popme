# 관심사: AI 코딩 에이전트 — 2026-10 직군별 조사(local/research/)에서 고른 출처와 기준. 출처 정의는 popme/feeds.toml
id = 'ai-coding'
name = 'AI 코딩 에이전트'
tag = 'AI 코딩'
summary = 'Claude Code·Codex 같은 AI 코딩 도구를 쓰며 개발해요'
order = 1
status = "ready"
topic = 'ai'                 # filter = true인 출처를 거를 판별 규칙 (popme/topics.py)
criteria = """
- 사용량 한도·리셋·크레딧·요금제 변경·무료 혜택이 최우선. 아래 「내 요금제」에 해당하는지, 기한·적용일을 적는다.
- 장애(쓰는 도구가 멈춤)와 보안(코딩 에이전트·MCP·IDE 확장의 프롬프트 인젝션·취약점·악성 패키지)은 영향 범위·대응을 한 줄로 앞에.
- 쓰는 도구(Claude Code·Codex 등)의 새 기능·바뀐 기본값·모델 교체·단종. 패치 릴리스는 동작이 바뀔 때만, 시험판(alpha·beta·rc·nightly)은 넣지 않는다.
  같은 릴리스가 GitHub·변경내역·X·HN에 함께 나오면 카드 하나로, 버전과 바뀐 점은 body에.
- 다른 코딩 도구(Cursor·Copilot·Cline 등)는 요금·큰 기능·모델처럼 갈아탈지 판단할 만한 것만.
- 에이전트 하네스·사용법(서브에이전트·hooks·컨텍스트 관리·평가)은 실제로 써 본 글만. 「10배 빨라짐」 류 홍보·프롬프트 모음은 버린다.
- 목록에 없는 사람이 만든 새 오픈소스·도구도 실제로 쓸 만하면 넣는다.
"""
discovery = '에이전트·Claude Code·Codex·개발 도구에 실질 정보를 주는 사람'
topics = ['요금·한도·혜택', '장애·보안', '새 기능·바뀐 기본값', '에이전트 사용법', '새 도구·오픈소스']   # 「특히 궁금한 것」 보기 (관심사 설정 ⑤)

