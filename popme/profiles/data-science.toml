# 관심사: 데이터 사이언스 — 2026-10 직군별 조사(local/research/)에서 고른 출처와 기준. 출처 정의는 popme/feeds.toml
id = 'data-science'
name = '데이터 사이언스'
tag = '데이터'
summary = 'pandas·SQL·실험·통계, 데이터 플랫폼 가격·변경'
order = 2
status = "ready"
topic = 'data'                 # filter = true인 출처를 거를 판별 규칙 (popme/topics.py)
criteria = """
- 쓰는 라이브러리(pandas·Polars·scikit-learn·statsmodels·PyMC·DuckDB·dbt 등)와 데이터 플랫폼의 메이저 버전·기본값 변경·지원 종료·가격·쿼터가 최우선. 버그 수정 릴리스는 결과 수치가 바뀌는 수정(통계 검정·난수·결측·조인)일 때만.
- 실험 설계·인과추론·통계는 실제 회사가 적용한 사례나 오래 쓸 방법론만. 입문 튜토리얼·리스트형 글·벤더 고객사례·행사 홍보는 버린다.
- LLM 소식은 분석 업무·데이터 제품에 쓰는 법(평가·라벨링·text-to-SQL·분석 에이전트·API 가격·batch)일 때만.
- 논문은 하루 1편까지, 실무 영향이 분명한 것만. 벤치마크 수치는 「~라는 주장」으로.
- 시험판(dev·rc·nightly), 리전 확장, 커넥터 Beta 추가는 넣지 않는다.
"""
discovery = '실험·통계·데이터 도구·LLM 분석 활용에 실질 정보를 주는 사람'
topics = ['라이브러리 큰 변경', '데이터 플랫폼 가격', '실험·인과추론', 'LLM으로 분석하기', '국내 데이터 조직 사례']   # 「특히 궁금한 것」 보기 (관심사 설정 ⑤)

