# POPME 예시 설정 — config.toml로 복사해서 고치세요 (config.toml은 저장소에 올라가지 않음).
# 고친 뒤 캐릭터 우클릭 > 종료 후 다시 실행하면 반영됩니다.

[character]
file = "character.toml"           # 캐릭터 파일. 없으면 character.example.toml(기본 캐릭터 "포피"). docs/CHARACTER.md

[user]
plan = "Claude Pro"               # 내 요금제 — 혜택·크레딧 대상 여부 판단 기준
tools = "Claude Code"              # 주로 쓰는 도구 — 소식이 "나한테 해당"인지 판단 기준 (쉼표로 여러 개)

[schedule]
briefing_after = "09:00"          # 이 시각 이후 앱이 켜져 있고 오늘 브리핑이 없으면 수집+브리핑

[chrome]
port = 9333                       # POPME 전용 Chrome 디버깅 포트
minimize_while_collecting = false # true면 수집 중 Chrome 창을 최소화

[x]
list_url = ""                     # X 리스트가 생기면 넣으세요(있으면 계정별 방문 대신 리스트 1번만 봄)
scrolls_per_page = 3              # 페이지당 스크롤 횟수 (사람 속도, 작게 유지)

accounts = [
  { handle = "thsottiaux",    name = "Tibo",              group = "제품 당사자",   focus = "Codex 업데이트·사용량 공지" },
  { handle = "bcherny",       name = "Boris Cherny",      group = "제품 당사자",   focus = "Claude Code 기능·사용법" },
  { handle = "trq212",        name = "Thariq Shihipar",   group = "제품 당사자",   focus = "Claude Code 기능·사용법" },
  { handle = "_catwu",        name = "Cat Wu",            group = "제품 당사자",   focus = "Claude Code 제품 방향·출시" },
  { handle = "embirico",      name = "Alexander Embiricos", group = "제품 당사자", focus = "Codex 제품 방향·출시" },
  { handle = "badlogicgames", name = "Mario Zechner",     group = "에이전트 제작자", focus = "pi 하네스 설계·구현" },
  { handle = "steipete",      name = "Peter Steinberger", group = "에이전트 제작자", focus = "OpenClaw·에이전트 개발 도구" },
  { handle = "hwchase17",     name = "Harrison Chase",    group = "에이전트 제작자", focus = "LangChain·Deep Agents·메모리·평가" },
