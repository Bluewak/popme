id = 'enterprise'
name = '엔터프라이즈 도입 (FDE)'
tag = '도입'
summary = '모델 단종·가격·리전, 엔터프라이즈 기능 GA, 국내 규제·클라우드'
order = 4
status = "ready"
topic = 'ent'                 # filter = true인 출처를 거를 판별 규칙 (popme/topics.py)
criteria = """
- 모델 단종·은퇴, API 가격·쿼터 변경, 서울·국내 리전 도입, 엔터프라이즈 기능 GA(SSO·감사 로그·DLP·네트워크 통제)를 맨 앞에. 날짜·대상 모델·영향 받는 경로(직접 API/Azure/Bedrock/Google)를 적고 Preview와 GA를 구분한다.
- 보안은 고객 시스템에 닿는 것만: 프롬프트 인젝션·에이전트·MCP·LLM 게이트웨이 취약점, 큰 API 장애. 심각도·영향 범위·대응을 한 줄로.
- 국내 규제(AI 기본법·개인정보위·금융권 망분리·공공 클라우드 기준)와 국내 LLM·클라우드(HyperCLOVA X·EXAONE·Solar·네이버·KT·NHN) 소식은 시행일·적용 대상을 적는다.
- 새 모델은 「어느 클라우드에서 언제 쓸 수 있나·라이선스·가격」으로 카드 하나에 묶고, 벤치마크 수치는 「~라는 주장」으로.
- SDK·CLI 패치, 다른 리전 확장, 투자·인수, 소비자 기능, 벤더 마케팅·행사 홍보는 넣지 않는다.
"""
discovery = '엔터프라이즈 도입·클라우드 AI·AI 보안·국내 규제에 실질 정보를 주는 사람'
