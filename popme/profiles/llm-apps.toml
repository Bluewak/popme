# 관심사: LLM 앱·RAG — 2026-10 직군별 조사(local/research/)에서 고른 출처와 기준. 출처 정의는 popme/feeds.toml
id = 'llm-apps'
name = 'LLM 앱·RAG'
tag = 'LLM 앱'
summary = 'RAG·에이전트 앱: 프레임워크·벡터 DB·임베딩·문서 파싱·평가'
order = 5
status = "ready"
topic = 'rag'                 # filter = true인 출처를 거를 판별 규칙 (popme/topics.py)
criteria = """
- 쓰는 프레임워크(LangChain·LangGraph·LlamaIndex·DSPy·Agents SDK·MCP)와 벡터 DB의 깨지는 변경·지원 중단·기본값 변경·보안 패치는 영향 버전·옮기는 법과 함께 맨 앞에. 패치 릴리스는 검색 결과·인덱스·체크포인트가 바뀔 때만.
- LLM API의 구조화 출력·툴 호출·캐시·가격·단종, 새 임베딩·리랭커(차원·가격·한국어 지원·다시 색인해야 하는지)는 놓치지 않는다.
- 새 RAG·검색 기법은 공개 벤치마크나 재현 가능한 수치가 있을 때만, 벤더 수치는 「~라는 주장」으로. 개념 설명·입문·「RAG is dead」 류·고객 사례·웨비나·제휴는 버린다.
- 프롬프트 인젝션·에이전트 보안은 실제 CVE·공개 PoC와 방어법이 있는 것만.
- HWP·스캔 PDF·표 파싱, 한국어 임베딩, 국내 구축 사례는 작아도 넣는다. rc·nightly·dev·내부 태그는 넣지 않는다.
"""
discovery = 'RAG·검색·임베딩·문서 파싱·LLM 앱 평가에 실질 정보를 주는 사람'
