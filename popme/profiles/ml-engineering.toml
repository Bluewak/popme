id = 'ml-engineering'
name = 'ML 엔지니어링'
tag = 'ML'
summary = '모델 서빙·학습·GPU 비용, 오픈 웨이트 모델'
order = 3
status = "ready"
topic = 'ml'                 # filter = true인 출처를 거를 판별 규칙 (popme/topics.py)
criteria = """
- 보안 권고(CVE·RCE·pickle/torch.load·인증 없는 엔드포인트)는 심각도·영향 버전·고친 버전을 적어 맨 앞에.
- 프레임워크 릴리스(vLLM·SGLang·TensorRT-LLM·PyTorch·transformers 등)는 깨지는 변경·기본값 변경·지원 CUDA/Python 변화·새 모델·하드웨어 지원·성능 수치만. rc·nightly·dev는 무시.
- 오픈 웨이트 모델 공개는 같은 모델을 다룬 여러 출처를 카드 하나로, 전체/활성 파라미터·컨텍스트·라이선스·필요 VRAM·vLLM/SGLang/llama.cpp 지원 여부를 적는다.
- GPU·클라우드는 가격·새 인스턴스·리전(특히 서울)·용량처럼 비용 결정에 닿는 것만. 투자·파트너십·데이터센터 건설·고객 사례·근거 없는 순위 주장은 뺀다.
- 기법·논문은 재현 가능한 수치(처리량·지연·메모리)가 있는 것 1~2개만.
"""
