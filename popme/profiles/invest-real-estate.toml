criteria = "- 정부·서울시 부동산 대책(대출 규제·토지거래허가구역·공급대책·세제 개편)은 무엇이 언제부터 바뀌고 누구에게 해당하는지를 맨 먼저 쓴다.\n- 한국부동산원 주간 아파트 가격동향·국토부 주택통계·실거래 신고가처럼 숫자가 나오는 공식 통계를 우선하고, 사용자가 고른 지역·단지 수치를 앞에 둔다.\n- 청약은 관심 지역의 분양 일정·분양가·경쟁률·무순위(줍줍) 공고를 날짜와 함께, 전월세는 전셋값·월세 전환·전세사기 대책을 챙긴다.\n- 재건축·재개발은 조합 설립·사업시행인가·관리처분·이주 같은 단계 변화와 분담금만 고르고, 행사·수상 같은 기관 홍보는 버린다.\n- 확정되지 않은 규제설·지라시는 「~라는 보도」로 쓰고 정부가 부인했으면 함께 적는다. 연예인 매매·경매 기사, 분양 광고성 기사, 「지금 사야」 류 전망 칼럼은 버린다.\n"
discovery = "국토부·한국부동산원 통계를 근거로 숫자를 대며 말하는 연구위원·리서치랩장을 고르고, 특정 단지 분양 홍보나 매수 권유를 하는 사람은 뺀다."
