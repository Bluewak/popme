criteria = "- 새 드라마 편성·공개일 확정, 주연 캐스팅 확정, 시즌2 제작 확정, 종영과 최종 시청률을 먼저 챙긴다.\n- 시청률은 닐슨코리아 수치, 화제성은 굿데이터 펀덱스 수치가 있는 기사를 고르고 「자체 최고」 같은 의미 있는 변화만 남긴다.\n- 캐스팅은 소속사 확정 발표만 사실로 쓰고, 「출연 제안을 받고 검토 중」은 「~라는 보도」로 적는다.\n- OTT는 요금제 변경·합병·서비스 종료처럼 구독자 지갑에 닿는 소식을 작품 소식보다 앞에 둔다.\n- 배우 화보·공항 패션·광고 모델·SNS 근황·열애 추측과 줄거리 요약만 있는 회차 기사는 버린다.\n- 작품을 둘러싼 논란(방영 중단 청원·고증 문제)은 사실관계가 분명한 것 하나만 남기고 악플 중계성 기사는 버린다.\n"
