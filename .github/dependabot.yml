# pip: requirements.txt의 범위를 넘는 새 버전을 알린다. 머지 전에 requirements.lock을 다시 만들어야 test_lock.py를 통과한다.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
