# 발굴 모드: 한국어 반응 많은 글을 찾는 X 검색 (작성자가 후보로 올라옴)
discovery_searches = [
  "(\"Claude Code\" OR Codex OR 클로드코드 OR 코덱스) lang:ko min_faves:20",
  "(AI 에이전트 OR MCP OR 바이브코딩) lang:ko min_faves:50",
]

[threads]
accounts = []                     # 꾸준히 볼 Threads 계정 (발굴 탭에서 "추가"하면 자동 포함)
scrolls_per_page = 3
# 발굴: 여러 태그에 반복 등장 + 반응 큰 한국어 작성자를 후보로 (점수 = 2×등장 수 + 좋아요합/100)
# 태그 중심 (Threads 프로필 "관심사" 목록 = 토픽 태그). 키워드 검색은 필요할 때만 searches에 추가
searches = []
tags = ["AI Threads", "Tech Threads", "AI", "인공지능AI", "AGI", "OpenAI", "Claude", "클로드코드", "코덱스", "바이브코딩", "MCP"]

[timetree]
url = "https://timetreeapp.com/calendars"   # 로그인 후 보이는 캘린더 주소로 바꿔도 됨
days_ahead = 2
default_calendar = ""              # 캐릭터에게 일정 부탁할 때 기본 캘린더 이름 (비우면 첫 캘린더). 다른 캘린더 서비스: docs/CALENDAR.md

[weather]                          # 날씨 대사용 (Open-Meteo, 키 불필요)
use_windows_location = true        # Windows 위치 서비스로 현재 지역 (실패하면 아래 고정 지역)
name = "서울"
lat = 37.57
lon = 126.98

