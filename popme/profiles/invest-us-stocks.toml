category = ["경제·투자", "미국주식"]
criteria = "- FOMC 결정과 의장 발언, CPI·고용 같은 지표 발표, 빅테크·반도체 실적과 가이던스처럼 지수를 움직인 사실을 먼저 고른다.\n- 실적은 예상 대비 매출·이익·가이던스와 시간외 주가 반응을 한 줄로, 관심 종목은 공식 발표(뉴스룸·SEC 보도)를 먼저 확인해 적는다.\n- Fed 관련 전망·관측은 「~라는 보도」 또는 「~는 전망」으로 쓰고, 확정된 결정·수치와 섞지 않는다.\n- 「지금 사야 할 종목」·「10배 오를 주식」 같은 투자 권유성 글, 리딩방·유료 리포트·뉴스레터 구독 홍보, 출처 없는 급등 예언은 버린다.\n- 같은 지수 움직임을 다룬 장중 기사는 버리고 뉴욕 마감 기준 하루 한 번만 정리하며, 한국 시간으로 언제 발표되는지 함께 적는다.\n"
discovery = "데이터와 근거를 공개하며 시장·Fed를 해설하고 종목 추천이나 유료 상품 홍보를 하지 않는 기자·전략가를 고른다."
topics = ["실적·가이던스", "FOMC·금리", "물가·고용", "AI 투자", "반도체 수출규제", "자사주·배당", "IPO", "환율"]

