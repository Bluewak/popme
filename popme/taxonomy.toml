# 관심사 분류표 (docs/INTERESTS-DESIGN.md 4-7): 대분류 → 소분류 (→ 세부).
# profile = 미리 조사해 둔 출처 묶음 (popme/profiles/<id>.toml). 없는 소분류는 고르면 「AI 질문」 방식(4-6)으로 새로 만든다 —
# 이때 「대분류 › 소분류」를 AI에게 함께 넘겨 분야를 좁힌다. 묶음은 조사·확인한 것부터 하나씩 채운다 (시행착오).
# 세부(children)가 있으면 소분류를 누를 때 펼친다. 사용자가 「직접 적기」로 많이 넣는 분야가 다음 소분류 후보.

