# POPME 소식 출처 목록 — 관심사(popme/profiles/*.toml)가 id로 가리킨다.
# id는 절대 바꾸지 않는다 (config의 off·on·tweak이 id로 가리킨다). 같은 출처의 주소만 바뀌면 url만 고친다.
# name을 바꾸면 old_names에 예전 이름을 남긴다 (DB에 저장된 글이 이름으로 이어져 있다).
# group = 묶음(브리핑에 넘길 때 상한 단위·화면에서 접히는 그룹), type = 출처 모듈 (없으면 rss — popme/sources/)
# type = 'hn': Hacker News 검색(Algolia 직접, popme/sources/hn.py) — words(이 중 하나라도)·points·front
# skip = 빼고 싶은 제목(정규식). via = "mirror"면 공식 RSS가 없어 github.com/Olshansk/rss-feeds 미러를 쓴다 (멈추기 쉬움)
# 2026-10 직군별 조사(AI 코딩·데이터 사이언스·ML 엔지니어링·엔터프라이즈 도입·LLM 앱)에서 실제로 열어 확인한 것들

